name: Auto Pack and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Stamp version into Version.txt
        run: |
          TAG_NAME=${{ github.ref_name }}
          sed -i "s/Pre-release/$TAG_NAME/g" Version.txt

      - name: Archive translation files to zip
        run: |
          zip -r PriconneRe-VN-${{ github.ref_name }}.zip Text/ Version.txt

      - name: Upload asset to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: PriconneRe-VN-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
